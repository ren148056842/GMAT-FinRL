[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mgat-finrl"
version = "1.0.0"
description = "Multi-relational graph attention Transformer forecasts for reinforcement learning portfolio research"
requires-python = ">=3.9,<3.12"
dependencies = ["numpy>=1.23,<2", "pandas>=1.4,<3"]
authors = [{name = "Zhiping Chen"}, {name = "Xiaoping Ren"}]
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["src"]
